# Temporary: downloads the Wayback Machine copy of the 2017 World Championship pages on this branch only
# (web.archive.org is not reachable from the development environment). Removed before merging.
name: Wayback fetch (one-off)

on:
  push:
    branches: [claude/project-thread-9uaz4f]
    paths: [scrapers/ithf_archive/fetch.py, .github/workflows/wayback_fetch_tmp.yaml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m scrapers.ithf_archive.fetch
      - name: Commit raw pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ithf_archive
          git diff --cached --quiet || { git commit -m "data: Wayback copy of WC 2017 pages"; git push origin "HEAD:$GITHUB_REF_NAME"; }
